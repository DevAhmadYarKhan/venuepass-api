[alembic]
# Resolve migration files relative to this configuration file.
script_location = %(here)s/migrations

# Make the src-layout package importable when Alembic starts from the repo root.
prepend_sys_path = .
path_separator = os

# migrations/env.py replaces this placeholder with DATABASE_URL at runtime.
sqlalchemy.url = driver://user:pass@localhost/dbname

# Configure console logging for Alembic while keeping SQLAlchemy output quiet.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine
propagate = 0

[logger_alembic]
level = INFO
handlers = console
qualname = alembic
propagate = 0

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
# Include timestamps and logger names in migration command output.
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
